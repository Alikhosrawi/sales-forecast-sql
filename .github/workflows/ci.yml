name: CI

on:
  push:
  pull_request:

jobs:
  checks-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the weekly pipeline (data checks + forecast + report)
        run: python run.py --out /tmp/ci-output

      - name: Tests
        run: python -m pytest -v

      - name: Leak scan
        env:
          LEAK_WORDS: ${{ secrets.LEAK_WORDS }}
        run: bash scripts/leak_scan.sh

      - name: Committed sample reports are up to date
        run: |
          python run.py --sample
          git diff --exit-code -- 'output/sample/*.md' 'output/backtest.md'
